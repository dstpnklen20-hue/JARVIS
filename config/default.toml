# Настройки Джарвиса по умолчанию. Этот файл лежит в git — не меняйте его.
# Свои значения пишите в config/user.toml: только те ключи, которые хотите
# изменить, в тех же секциях. Пример:
#
#   [audio]
#   input_device = "Fuxi-H3"

[general]
# Команды распознаются и пишутся в журнал, но не выполняются.
dry_run = false

[audio]
# "default" — системный микрофон по умолчанию.
# Иначе — часть имени устройства, например "ME6S" или "Fuxi-H3".
# Список устройств показывает `jarvis --check`.
input_device = "default"

[wake]
# Слова, на которые откликается Джарвис, — так, как их пишет распознаватель.
# После `jarvis --enroll` к ним добавляется то, как распознаватель слышит именно вас.
words = ["джарвис", "жарвис"]
# Сколько букв может отличаться от слова (0–2). Больше — чувствительнее,
# но выше риск ложных срабатываний.
max_edit_distance = 1
# Сколько секунд после «Джарвис» ждать команду, прежде чем вернуться в ожидание (2–30).
listen_secs = 6

[listen]
# Тишина в конце фразы, после которой команда считается сказанной (300–2000 мс).
# Меньше — быстрее итог, но модель выдаёт слова с задержкой до 0.6 с, и при
# малом значении фраза рвётся («поставь» | «на паузу»). Обычно команда
# выполняется раньше — по частичному тексту (см. [nlu]).
end_silence_ms = 800
# Подсказки распознавателю: слова команд узнаются увереннее (0–4, 0 — выключить).
# Больше 2.5 начинает искажать обычные слова.
hotwords_score = 1.5

[nlu]
# Насколько фраза должна быть похожа на команду (0–1). Ниже — «Не понял, сэр».
min_score = 0.75
# Если лучшая и вторая команды ближе этого — переспросить, а не угадывать.
ambiguity_margin = 0.05
# Выполнить, не дожидаясь конца фразы, если сходство не ниже этого (0–1)…
early_score = 0.92
# …и текст не меняется столько миллисекунд (0 — выключить раннее срабатывание).
early_stable_ms = 300
# Выполнить сразу, если начало фразы однозначно ведёт к одной команде и
# покрывает такую долю её длины («открой ю…» → «открой ютуб»). 0 — выключить.
prefix_min_ratio = 0.6

[speaker]
# Откликаться только на ваш голос. Работает после `jarvis --enroll`;
# без записанного образца голоса проверка пропускается.
verify = true
# Порог сходства голоса 0–1 или "auto" — значение, подобранное при --enroll.
threshold = "auto"

[vad]
# Детектор речи: "silero" или "ten".
engine = "silero"

[voice]
# Звуковой пакет — папка в sounds/.
pack = "default"
# Громкость ответов (0–2, 1 — без изменений).
volume = 1.0
# Голос синтеза для динамических ответов (вопрос-разрешение, «вы имели в виду…»):
# "dmitri" (мужской, по умолчанию), "ruslan", "denis", "irina" (женский) или "none" —
# без синтеза, только звуковой пакет. Голоса кроме dmitri: scripts\download-models.ps1 -Full.
tts = "dmitri"
# Темп синтеза (0.5–2, 1 — обычный).
tts_speed = 1.0

[hotkeys]
# Аварийная остановка: замолчать, отменить действие, поставить слух на паузу.
# Формат: модификаторы + клавиша, например "Ctrl+Alt+F12", "Ctrl+Shift+Pause".
# Пустая строка — без горячей клавиши (останется «Джарвис, стоп» и трей).
emergency_stop = "Ctrl+Alt+F12"

[session]
# Сколько секунд после команды Джарвис ждёт следующую без «Джарвис» (3–60).
follow_up_secs = 12

[logging]
# Уровень: trace, debug, info, warn, error.
# Можно задать по компонентам: "info,jarvis_core=debug".
# Переменная окружения RUST_LOG имеет приоритет.
level = "info"
# Папка логов (относительно корня проекта). Файлы ротируются раз в сутки.
dir = "logs"
# Сколько суточных файлов хранить (1–365).
max_files = 14

[paths]
# Все пути — относительно корня проекта (папки с config/).
models = "models"
native_libs = "lib"
commands = "commands"
sounds = "sounds"
# Ваши данные: образец голоса и т. п. В git не попадает.
data = "data"
