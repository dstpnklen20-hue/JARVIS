[workspace]
resolver = "3"
members = [
    "crates/jarvis-core",
    "crates/jarvis-platform",
    "crates/jarvis-audio",
    "crates/jarvis-nlu",
    "crates/jarvis-actions",
    "crates/jarvis-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Версии сверены с crates.io 2026-10-12. Точные версии зафиксированы в Cargo.lock.
[workspace.dependencies]
jarvis-core = { path = "crates/jarvis-core" }
jarvis-platform = { path = "crates/jarvis-platform" }
jarvis-audio = { path = "crates/jarvis-audio" }
jarvis-nlu = { path = "crates/jarvis-nlu" }
jarvis-actions = { path = "crates/jarvis-actions" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
ringbuf = "0.5.2"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
# Статическая сборка; архив библиотеки — см. .cargo/config.toml.
sherpa-onnx = "1.13.8"
strsim = "0.11.1"
thiserror = "2.0.21"
tray-icon = "0.26.1"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time"] }
time = { version = "0.3.47", features = ["local-offset", "macros"] }
windows-sys = "0.61.2"

tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
