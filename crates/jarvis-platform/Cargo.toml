[package]
name = "jarvis-platform"
description = "Платформозависимый код Джарвиса (Windows): ОС, права, позже ввод клавиш, трей, питание"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Единственный крейт, где разрешён unsafe: только вызовы WinAPI,
# минимальными блоками, каждый с комментарием `// SAFETY:`.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
