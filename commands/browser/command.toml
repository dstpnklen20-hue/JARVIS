# Сайты в браузере по умолчанию. find_tab — сначала поискать уже открытую
# вкладку по заголовку (сейчас умеет Firefox): нашлась — переключиться, нет —
# открыть адрес. «*» — любые символы, регистр не важен.
pack = "browser"
version = 1

[[command]]
id = "open_youtube"
phrases = ["открой ютуб", "запусти ютуб", "включи ютуб", "открой youtube"]
description = "откроет YouTube в браузере"
reply = "ok"
[command.action]
type = "open_url"
url = "https://www.youtube.com"
find_tab = ["* - YouTube", "YouTube"]

[[command]]
id = "open_google"
phrases = ["открой гугл", "открой google", "открой поиск"]
description = "откроет поиск Google в браузере"
reply = "ok"
[command.action]
type = "open_url"
url = "https://www.google.com"
# Только пустая страница Google — вкладки с результатами поиска не подходят.
find_tab = ["Google"]

[[command]]
id = "open_browser"
phrases = ["открой браузер", "запусти браузер", "открой файрфокс", "запусти файрфокс"]
description = "выведет вперёд окно Firefox, а если он закрыт — запустит"
reply = "ok"
close = true
[command.action]
type = "launch_app"
path = 'C:\Program Files\Mozilla Firefox\firefox.exe'
focus = "firefox.exe"

[[command]]
id = "open_calendar"
phrases = ["открой календарь", "покажи календарь", "открой гугл календарь"]
description = "откроет Google Календарь в браузере"
reply = "ok"
[command.action]
type = "open_url"
url = "https://calendar.google.com"
find_tab = ["Google Календарь*", "Google Calendar*"]

[[command]]
id = "open_music"
# Без «открой ютуб …»: Джарвис выполняет команду по точному началу фразы,
# и «открой ютуб» сработало бы раньше, чем прозвучит «музыку».
phrases = ["открой музыку", "запусти музыку", "открой мьюзик"]
description = "откроет YouTube Music в браузере"
reply = "ok"
[command.action]
type = "open_url"
url = "https://music.youtube.com/"
find_tab = ["YouTube Music", "* - YouTube Music"]
